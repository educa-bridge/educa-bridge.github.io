    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Simular dados recebidos do backend
        const estudantes = [
            { nome: "João Silva", universidade: "Universidade A", curso: "Engenharia", gpa: 3.8 },
            { nome: "Maria Oliveira", universidade: "Universidade B", curso: "Medicina", gpa: 3.9 },
            { nome: "Carlos Santos", universidade: "Universidade C", curso: "Direito", gpa: 3.7 }
        ];

        // Preencher tabela de estudantes
        const estudantesList = document.getElementById("estudantes-list");
        estudantes.forEach(estudante => {
            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${estudante.nome}</td>
                <td>${estudante.universidade}</td>
                <td>${estudante.curso}</td>
                <td>${estudante.gpa}</td>
                <td>
                    <a href="#" class="btn btn-sm btn-outline-primary">Ver Perfil</a>
                    <a href="#" class="btn btn-sm btn-outline-success">Convidar</a>
                </td>
            `;
            estudantesList.appendChild(row);
        });
    </script>
